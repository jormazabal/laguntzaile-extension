<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laguntzaile</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🦉</span>
        <span class="logo-text" id="app-name">Laguntzaile</span>
      </div>
      <div class="header-actions">
        <select id="lang-select" class="lang-select" aria-label="Idioma">
          <option value="es">ES</option>
          <option value="en">EN</option>
          <option value="eu">EU</option>
        </select>
        <button id="link-options" class="btn-icon-only" title="Opciones">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="main">
      <div class="action-buttons">
        <button id="btn-read" class="action-btn action-btn--read">
          <div class="action-btn__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
            </svg>
          </div>
          <span class="action-btn__text" id="btn-read-text">Leer</span>
        </button>
        <button id="btn-explain" class="action-btn action-btn--explain">
          <div class="action-btn__icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </div>
          <span class="action-btn__text" id="btn-explain-text">Explicar</span>
        </button>
      </div>

      <div class="status" id="status">
        <span class="status-dot"></span>
        <span class="status-text" id="status-text">Listo</span>
      </div>

      <div class="result-container" id="result-container">
        <div class="result-text" id="result-text"></div>
      </div>

      <div class="error-container hidden" id="error-container">
        <div class="error-message" id="error-message"></div>
        <button id="btn-config" class="btn-config hidden">Configurar</button>
      </div>
    </main>

    <footer class="footer">
      <p class="footer-note" id="privacy-note">📸 Captura enviada a OpenAI</p>
      <span class="footer-dot">•</span>
      <p class="footer-note" id="tts-note">🤖 Voz IA</p>
    </footer>
  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
